name: Cut Release

# Automates the two manual, easy-to-get-wrong steps of starting a release: tagging the merged
# commit and creating the GitHub Release as a draft (never "Publish release" directly - see
# release.yml for why). Run this after a version-bump PR has merged to main; it does the rest by
# creating a draft Release, which release.yml picks up automatically.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute the release tag from package.json
        id: v
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Refuse to re-cut an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.v.outputs.tag }} already has a Release. Bump the version in package.json and merge that first."
            exit 1
          fi

      - name: Tag main and push the tag
        run: |
          set -euo pipefail
          git tag "${{ steps.v.outputs.tag }}"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Create the draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$TAG" \
            --target main \
            --title "$TAG" \
            --generate-notes \
            --draft \
            "${prerelease_flag[@]}"
          echo "::notice::Draft $TAG created - release.yml is now building, testing, and publishing it."
