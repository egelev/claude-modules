name: Release

# Manually triggered, end-to-end: reads the version off main's package.json, builds/tests/packs
# the tarball, tags main, opens the Release as a draft, attaches the tarball while it's still
# mutable, publishes to npm, and only as the last step publishes the Release itself (which is
# also when it becomes immutable - GitHub locks a Release's assets the instant it's published).
#
# Everything happens in one job/run on purpose: an earlier design split this into two workflows
# (a "cut-release" job that opened a draft, and this one triggered by `on: release: types:
# [created]`) and it silently never ran, because GitHub does NOT fire Actions triggers for draft
# release created/edited/deleted events - only `published` (and other non-draft transitions) do.
# There is no event to hook mid-flow, so the whole thing has to happen in a single run instead.
on:
  workflow_dispatch: {}

permissions:
  contents: write # tag main, attach the tarball, and publish the Release
  id-token: write # OIDC token for npm Trusted Publishing (no stored NPM token)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Refuse to run against anything but main
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::release.yml was dispatched against '${{ github.ref_name }}', not main. Re-run it with 'Use workflow from: main' (or 'gh workflow run release.yml --ref main')."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute the release tag from package.json
        id: v
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to re-cut an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already has a Release. Bump the version in package.json and merge that first."
            exit 1
          fi

      # No registry-url: that makes setup-node write an `_authToken` line into .npmrc, which
      # interferes with the OIDC exchange when no token is set. npm's default registry is
      # registry.npmjs.org already. (actions/setup-node#1551, npm/documentation#1960)
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1; some Node 24.0.x images still ship 11.3.x.
      - run: npm install -g npm@^11.5.1
      - run: node --version && npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Build the exact tarball that will be published (prepack rebuilds dist/) and prove the
      # installed layout works before doing anything irreversible.
      - name: Pack and smoke-test the tarball
        run: |
          set -euo pipefail
          npm pack
          npm install -g ./claude-modules-*.tgz
          expected="$(node -p "require('./package.json').version")"
          actual="$(claude-modules --version)"
          echo "package.json=$expected  cli --version=$actual"
          [ "$expected" = "$actual" ] || { echo "::error::version mismatch in packed CLI"; exit 1; }
          claude-modules --help > /dev/null

      - name: Tag main
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push origin "$TAG"

      - name: Open the Release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease_flag=()
          if [ "${{ steps.v.outputs.prerelease }}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi
          gh release create "$TAG" --target main --title "$TAG" --generate-notes --draft "${prerelease_flag[@]}"

      - name: Attach the tarball to the (still-draft) Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release upload "$TAG" claude-modules-*.tgz

      # npm publish is irreversible, so every failure before this point is a clean re-run and the
      # Release stays a draft (not visible, nothing to undo).
      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          cat ~/.npmrc 2>/dev/null || echo "no user .npmrc (expected)"
          npm publish ${{ steps.v.outputs.prerelease == 'true' && '--tag next' || '' }}

      # Last step: only now does the Release go live (and become immutable), and only after the
      # tarball is attached and npm publish has already succeeded.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
