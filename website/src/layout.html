<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f97316" />

  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{canonical}}" />
{{robots}}

  <!-- Open Graph / Twitter. og-cover.png (1200x630) is generated from
       assets/og-cover.svg — see website/README.md. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="claude-modules" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{canonical}}" />
  <meta property="og:image" content="{{og_image}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{og_image}}" />

  {{json_ld}}

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="assets/style.css" />

  <!-- Without JS the mobile nav toggle is inert, so the collapsed drawer would
       be unreachable. Fall back to a static stacked nav. Must come after the
       stylesheet so it wins on source order over the @media rule it overrides. -->
  <noscript><style>
    @media (max-width: 50rem) {
      .site-header { position: static; height: auto; }
      .site-header .container { flex-wrap: wrap; }
      .nav-links { visibility: visible; position: static; transform: none; width: 100%; order: 3; }
      .nav-toggle { display: none; }
    }
  </style></noscript>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  {{header}}

{{content}}

  {{footer}}
</body>
</html>
